<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>bilitube</title>
<meta name="theme-color" content="#ffffff">
<!-- 封面直连 B 站图床：外站 Referer 它会 403。same-origin＝去别家不带 Referer，同站页面照带（播放页靠它认出从逛片页点进去的） -->
<meta name="referrer" content="same-origin">
<!-- bilitube 逛片页：推荐 / 关注 / 聊过 / 我的四页，点一部片跳到播放页（../?film=…）。
     外壳（顶栏、底栏、设置卡、按压手感、过渡动画）照 eryu（耳屿，CC BY-NC-SA 4.0，
     https://github.com/sebastianevan200-stack/eryu ，© Evelyn & River）的 client/index.html 改写，皮肤变量名沿用 eryu（见 skins.css）。
     两套皮：黑白（默认）和自定义（主题色＋自传底图），共用一个日夜开关（html[data-theme]）。
     部署要改的东西都在 config.js。
     图标：Lucide（https://lucide.dev ，ISC License，Copyright (c) Lucide Contributors 2022；
     portions (c) Cole Bemis 2013-2022, Feather, MIT）为主，另有两枚与 Feather Icons（MIT）相同，见 icons.js 和仓库根目录 NOTICE。 -->
<script src="config.js?v=9"></script>
<script>/* 在样式表加载前先把皮肤和日夜写到 <html> 上，免得开页闪一下。
   日夜的优先级：地址里的 ?theme= > 用户在设置里选过的 > config.followThemeKey 指向的键 > 系统深浅色。
   皮肤同理（?skin= > 选过的），只认 custom，其他值一律当黑白（bw）。 */
(function () {
  var C = window.BILITUBE_CONFIG || {}, P = C.storePrefix || "bilitube_", d = document.documentElement, s = null, t = null, q = null;
  try { q = new URLSearchParams(location.search); } catch (e) {}
  try { s = localStorage.getItem(P + "skin"); t = localStorage.getItem(P + "theme"); } catch (e) {}
  if (q && q.get("skin")) s = q.get("skin");
  if (q && q.get("theme")) t = q.get("theme");
  if (t !== "dark" && t !== "light") {
    try { if (C.followThemeKey) t = localStorage.getItem(C.followThemeKey); } catch (e) {}
    if (t !== "dark" && t !== "light") t = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  }
  if (s !== "custom") s = "bw";
  /* 嵌入模式（?embed=1，且确实在 iframe 里）：给宿主聊天页用的窄版——没有底栏，推荐页顶栏右边那颗进「我的」。
     版式在 app.css 末尾，配色在 skins.css 末尾。 */
  if (q && q.get("embed") === "1" && window.parent !== window) d.setAttribute("data-embed", "1");
  d.setAttribute("data-theme", t);
  d.setAttribute("data-skin", s);
  document.querySelector('meta[name="theme-color"]').content = t === "dark" ? "#0a0a0a" : "#ffffff";
})();</script>
<link rel="stylesheet" href="skins.css?v=9">
<link rel="stylesheet" href="app.css?v=12">
</head>
<body>
<div id="skin-bg"></div>
<div id="app">
  <div class="topbar">
    <a class="topbar-btn" id="homeBtn" href="#" title="回主页" aria-label="回主页" hidden><i data-ic="back" data-s="20" data-w="1.8"></i></a>
    <form class="search-bar" id="searchForm" role="search" hidden>
      <button class="search-btn" type="submit" aria-label="搜索"><i data-ic="search" data-s="16" data-w="2"></i></button>
      <input class="search-input" id="searchIn" type="search" placeholder="搜 B 站视频" autocomplete="off" enterkeyhint="search">
      <button class="search-clear hidden" id="searchX" type="button" aria-label="清空"><i data-ic="x" data-s="14" data-w="2"></i></button>
    </form>
    <div class="topbar-title" id="topTitle"></div>
    <button class="topbar-btn" id="setBtn" type="button" title="设置" aria-label="设置"><i data-ic="gear" data-s="19" data-w="1.8"></i></button>
  </div>

  <div class="ptr" id="ptr" aria-hidden="true"><i data-ic="refresh" data-s="17" data-w="2"></i></div>
  <main class="tab-body" id="body">
    <section class="page" data-page="rcmd" id="pg-rcmd"></section>
    <section class="page" data-page="follow" id="pg-follow" hidden></section>
    <section class="page" data-page="talked" id="pg-talked" hidden></section>
    <section class="page" data-page="me" id="pg-me" hidden></section>
    <section class="page" data-page="sub" id="pg-sub" hidden></section>
  </main>

  <nav class="bottom-nav" id="nav">
    <button class="nav-item active" data-go="rcmd" type="button"><i data-ic="cloud"></i><span>For You</span></button>
    <button class="nav-item" data-go="follow" type="button"><i data-ic="users"></i><span>Following</span></button>
    <button class="nav-item" data-go="talked" type="button"><i data-ic="chat"></i><span>Together</span></button>
    <button class="nav-item" data-go="me" type="button"><i data-ic="home"></i><span>Home</span></button>
  </nav>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="icons.js"></script>
<script>window.BILITUBE_ICONS.mount();</script>
<script src="demo.js?v=2"></script>
<script src="prefs.js?v=5"></script>
<script src="app.js?v=12"></script>
</body>
</html>
