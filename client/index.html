<!DOCTYPE html>
<html lang="zh" data-ui="b">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- 直连：B 站 CDN 看见外站 Referer 会拒（有的节点直接 403），<video> 又没有自己的 referrerpolicy 属性，
     所以整页不带 Referer。同源接口（api/）不看 Referer，不受影响。 -->
<meta name="referrer" content="no-referrer">
<title>bilitube</title>
<script>
/* 嵌入模式：宿主页面用 iframe 装这一页时带 ?embed=1（或 #embed）。和 browse/ 一样，只在确实装在 iframe 里时才认——
   直接在浏览器里打开带 embed=1 的地址就是普通版（窄版没有返回钮，单独打开会走不出去）。
   旗标只在开页时认一次，钉在 <html data-embed>；之后 open() 改 hash 也不会把它冲掉。 */
(function () {
  try {
    if ((/[?&]embed=1(&|$)/.test(location.search) || location.hash === "#embed") && window.parent !== window) document.documentElement.dataset.embed = "1";
  } catch (e) {}
})();
</script>
<script>
/* 开页前的分流和日夜。
   · 没带片子（没有 ?film= 也没有 #片名）：这页没东西可放，直接换到逛片页 browse/（嵌入时换到 browse/?embed=1）。
   · 从 browse/ 点进来的：把来处记进 sessionStorage，返回钮回到那一页。嵌入时不看 referrer，返回走 browse/ 自己记的页名。
   · 日夜：bilitube_theme（在哪页点过都算）> 系统深浅色，挂在 <html data-ui-theme>。 */
(function () {
  var d = document.documentElement;
  var q = null, ref = "";
  try { q = new URLSearchParams(location.search); } catch (e) { return; }
  var hasFilm = !!q.get("film") || (location.hash.length > 1 && location.hash !== "#embed");
  if (!hasFilm) {
    d.dataset.leaving = "1";
    location.replace("browse/" + (d.dataset.embed === "1" ? "?embed=1" : ""));
    return;
  }
  if (d.dataset.embed !== "1") {
    try { var r = new URL(document.referrer); if (r.origin === location.origin && r.pathname.indexOf(location.pathname.replace(/[^\/]*$/, "") + "browse/") === 0) ref = r.href; } catch (e) {}
  }
  try { if (ref) sessionStorage.setItem("bilitube_ui_back", ref); } catch (e) {}
  var t = null;
  try { t = localStorage.getItem("bilitube_theme"); } catch (e) {}
  if (t !== "dark" && t !== "light") t = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  d.dataset.uiTheme = t;
})();
</script>
<script>
/* 嵌入模式的配色，两个方向（独立打开时不跑）：
   · 往外：bilitube:skin 报这一刻在用的几样颜色（宿主拿去给装这一页的外框上色）；宿主发 bilitube:skin? 就再报一次。
   · 往里：宿主发 bilitube:theme {vars} 递它自己的颜色，这里挂成 <html> 上的 --host-*，并标 data-skin-from="host"，
     样式表「宿主递来的配色」那段把它们映射到页内变量；不带 vars 的 bilitube:theme 等于收回，换回自己的皮。
   两个方向用同一组名字：panel 面板 / bg 底 / tile 色块 / tile2 深一档色块 / ink 主字 / ink2 次字 / ink3 小字 /
   accent 强调 / accent2 强调字 / onAccent 强调块上的字 / line 分隔 / radius 圆角 / dark 是否夜间。
   名字和 browse/ 报的那份对齐，宿主不用分是哪一页。 */
(function () {
  var d = document.documentElement;
  if (d.dataset.embed !== "1" || window.parent === window) return;
  var KEYS = ["panel", "bg", "tile", "tile2", "ink", "ink2", "ink3", "accent", "accent2", "onAccent", "line", "radius"];
  var cssName = function (k) { return "--host-" + k.replace(/[A-Z]/g, function (c) { return "-" + c.toLowerCase(); }); };
  var OUT = { panel: "--paper", bg: "--seam", tile: "--milk", tile2: "--milk-strong", ink: "--ink", ink2: "--ink-soft", ink3: "--muted",
              accent: "--btn", accent2: "--ink", onAccent: "--btn-ink", line: "--line" };
  function tell() {
    try {
      var cs = getComputedStyle(d), v = {};
      for (var k in OUT) v[k] = cs.getPropertyValue(OUT[k]).trim();
      v.radius = "14px";
      v.dark = d.dataset.skinFrom === "host" ? d.dataset.hostTone === "dark" : d.dataset.uiTheme === "dark";
      window.parent.postMessage({ type: "bilitube:skin", from: d.dataset.skinFrom || "own", vars: v }, location.origin);
    } catch (e) {}
  }
  var raf = 0;
  function tellSoon() { cancelAnimationFrame(raf); raf = requestAnimationFrame(tell); }
  function applyHost(m) {
    var v = m.vars || {};
    KEYS.forEach(function (k) { if (v[k]) d.style.setProperty(cssName(k), String(v[k])); else d.style.removeProperty(cssName(k)); });
    d.dataset.skinFrom = "host"; d.dataset.hostTone = v.dark ? "dark" : "light";
    d.style.colorScheme = v.dark ? "dark" : "light";
  }
  function dropHost() {
    KEYS.forEach(function (k) { d.style.removeProperty(cssName(k)); });
    delete d.dataset.skinFrom; delete d.dataset.hostTone; d.style.colorScheme = "";
  }
  // 宿主把上一次递进来的那份记在 sessionStorage（同源同标签页共用），首帧就挂上，免得先闪一下自己的皮
  try { var last = JSON.parse(sessionStorage.getItem("bilitube_host_theme") || "null"); if (last && last.vars) applyHost(last); } catch (e) {}
  window.addEventListener("message", function (ev) {
    if (ev.origin !== location.origin || ev.source !== window.parent) return;
    var m = ev.data || {};
    if (m.type === "bilitube:theme") { if (m.vars) applyHost(m); else dropHost(); tellSoon(); }
    else if (m.type === "bilitube:skin?") tellSoon();
  });
  new MutationObserver(tellSoon).observe(d, { attributes: true, attributeFilter: ["data-ui-theme"] });
  document.addEventListener("DOMContentLoaded", tellSoon);
  window.addEventListener("load", tellSoon);
})();
</script>
<style>
/* 样式分两层：
   ① 这一段是骨架——各个部件的排布、尺寸，以及画面上那几层（弹幕设置、稍后再看、小签）的默认样子；
   ② 后面 html[data-ui="b"] 那一大段是外观——颜色、字、白块、抽屉。颜色变量全在那一段里定义，日夜看 data-ui-theme。
   <html> 上的 data-ui="b" 是写死的，只是给第二层的选择器当前缀用。 */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; }
body { font-family: system-ui, sans-serif; line-height: 1.6; font-size: 15px; }
.wrap { max-width: 780px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px 24px; }
.spacer { flex: 1; }
[hidden] { display: none !important; }

/* ── 发弹幕那一行（私人弹幕）：贴在画面底下 ── */
.say { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.say input {
  flex: 1; min-width: 0; min-height: 36px; padding: 0 12px; font: inherit; font-size: 14px;
  border: 1px solid var(--border-soft); border-radius: 11px; background: var(--card); color: var(--text);
}
.say button {
  flex: none; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
  padding: 0; border: 0; border-radius: 999px; background: var(--accent-deep); color: #fff; cursor: pointer;
  transition: transform .14s cubic-bezier(.23,1,.32,1), opacity .16s ease;
}
.say button:active { transform: scale(.94); }
.say button:disabled { opacity: .45; cursor: default; }
.say svg { width: 16px; height: 16px; }
@media (pointer: coarse) { .say input { font-size: 16px; } }   /* iOS 小于 16px 会自己放大页面 */

/* ── 画面 ── */
.stage { position: relative; border-radius: 16px; overflow: hidden; background: var(--screen); box-shadow: 0 10px 28px var(--shadow); }
video { display: block; width: 100%; max-height: 62vh; background: var(--screen); }
/* AI 这会儿也开着这一幕时，右上角亮一会儿 */
.badge {
  position: absolute; top: 10px; right: 48px; display: none; align-items: center; gap: 6px;
  padding: 6px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
  background: rgba(28,20,30,.72); color: #f0e6f5; border: 1px solid rgba(175,155,212,.5);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.badge[data-on="1"] { display: flex; animation: pop .3s ease; }
@keyframes pop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
/* 放不了的时候（格式不支持、B 站不给放）画面那块换成一段说明 */
.mkv { padding: 16px; color: #e8dbe6; font-size: 13.5px; line-height: 1.7; }
.mkv code { display: block; margin-top: 8px; background: #ffffff14; border-radius: 8px; padding: 8px 10px; font-size: 11.5px; word-break: break-all; }

/* ── 弹幕画布（B 站弹幕和两个人的弹幕画在同一块上）── */
#dm { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dm-toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
.dm-toggle input { width: 16px; height: 16px; accent-color: var(--accent-deep); }

/* ── 稍后再看（B 站账号那份）：换片不退出 ── */
.pl {
  position: absolute; top: 8px; left: 8px; right: 8px; z-index: 6;
  max-height: calc(100% - 16px); display: flex; flex-direction: column;
  background: rgba(28,20,30,.93); color: #f0e6f5; border: 1px solid rgba(255,255,255,.18);
  border-radius: 12px; box-shadow: 0 10px 28px rgba(0,0,0,.4);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.pl[hidden] { display: none !important; }
.pl-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 6px 6px; }
.pl-row .cv { position: relative; overflow: hidden; }
.pl-row .cv img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.pl-sec { padding: 10px 8px 4px; font-size: 11px; opacity: .6; letter-spacing: .04em; }   /* 稍后再看底下那一小段「本地片」 */
.pl-row {
  display: flex; align-items: center; gap: 9px; padding: 5px 6px; border-radius: 9px; cursor: pointer;
  -webkit-user-select: none; user-select: none; transition: background-color .16s ease, transform .14s cubic-bezier(.23,1,.32,1);
}
.pl-row:active { transform: scale(.985); }
.pl-row[data-on="1"] { background: rgba(255,255,255,.12); }
.pl-row .cv { flex: none; width: 56px; aspect-ratio: 16/9; border-radius: 6px; background: rgba(255,255,255,.08) center/cover no-repeat; }
.pl-row .tx { flex: 1; min-width: 0; }
.pl-row .t { font-size: 12.5px; font-weight: 600; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl-row .m { margin-top: 2px; font-size: 11px; opacity: .6; display: flex; gap: 7px; }
.pl-row .m span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl-row .x { flex: none; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
  padding: 0; border: 0; border-radius: 999px; background: transparent; color: inherit; opacity: .6; cursor: pointer; }
.pl-row .x svg { width: 14px; height: 14px; }
.pl-note { flex: none; padding: 4px 12px 10px; font-size: 11.5px; opacity: .7; }
.pl-note[hidden] { display: none !important; }
@media (hover: hover) and (pointer: fine) {
  .pl-row:hover { background: rgba(255,255,255,.1); }
  .pl-row .x:hover { opacity: 1; }
}

/* ── 弹幕设置 ── */
.dm-panel {
  position: absolute; top: 46px; right: 8px; z-index: 5; width: min(310px, calc(100% - 16px));
  max-height: calc(100% - 54px); overflow: auto; -webkit-overflow-scrolling: touch;
  background: rgba(28,20,30,.93); color: #f0e6f5; border: 1px solid rgba(255,255,255,.18); border-radius: 12px;
  padding: 8px 12px 10px; font-size: 12.5px; line-height: 1.5; box-shadow: 0 10px 28px rgba(0,0,0,.4);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.dm-row { display: flex; align-items: center; gap: 8px; min-height: 28px; }
.dm-row .k { flex: none; width: 62px; color: #cbbfd6; font-size: 12px; }
.dm-row input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent-deep); }
.dm-row .val { flex: none; width: 40px; text-align: right; font-variant-numeric: tabular-nums; color: #cbbfd6; font-size: 11.5px; }
.dm-row .dm-toggle { color: inherit; font-size: 12.5px; }
.dm-seg { display: flex; gap: 4px; flex: 1; }
.dm-seg button { flex: 1; border: 1px solid rgba(255,255,255,.22); background: transparent; color: inherit; border-radius: 6px; font: inherit; font-size: 11.5px; padding: 3px 0; cursor: pointer; }
.dm-seg button[data-on="1"] { background: var(--accent-deep); border-color: transparent; color: #fff; }
.dm-checks { display: flex; flex-wrap: wrap; gap: 4px 10px; flex: 1; }
.dm-checks label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.dm-checks input, .dm-row .dm-toggle input { accent-color: var(--accent-deep); width: 15px; height: 15px; }
.dm-panel textarea {
  flex: 1; min-width: 0; min-height: 40px; border-radius: 8px; border: 1px solid rgba(255,255,255,.22);
  background: rgba(255,255,255,.06); color: inherit; font: inherit; font-size: 12px; padding: 5px 7px; resize: vertical;
}
.dm-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; color: #cbbfd6; font-size: 11.5px; }
.dm-foot button { border: 0; background: none; color: #f2b8cf; font: inherit; font-size: 12px; cursor: pointer; padding: 0; }
/* 两个人的弹幕飘完，右下角留 3 秒「最近一条」小签（很淡，不挡操作） */
.dm-last {
  position: absolute; right: 10px; bottom: 52px; z-index: 3; max-width: min(62%, 320px);
  padding: 3px 10px; border-radius: 999px; background: rgba(28,20,30,.42); color: rgba(240,230,245,.78);
  font-size: 12px; line-height: 1.5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  pointer-events: none; opacity: 0; transform: translateY(4px);
  transition: opacity .35s ease, transform .35s cubic-bezier(.23,1,.32,1);
}
.dm-last[data-on="1"] { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { .dm-last { transition: opacity .2s linear; transform: none; } }

/* ── 评论区（只读）── */
.cmt { margin-top: 14px; border: 1px solid var(--border-soft); border-radius: 14px; background: var(--card); overflow: hidden; }
.cmt-head {
  display: flex; align-items: center; gap: 8px; width: 100%; padding: 11px 13px; border: 0;
  background: none; font: inherit; font-size: 13.5px; font-weight: 600; color: inherit; cursor: pointer; text-align: left;
}
.cmt-head .n { font-weight: 400; font-size: 12px; color: var(--faint); }
.cmt-head .caret { margin-left: auto; color: var(--faint); transition: transform .18s ease; }
.cmt[data-open="1"] .cmt-head .caret { transform: rotate(90deg); }
.cmt-body { padding: 0 13px 12px; display: flex; flex-direction: column; gap: 10px; }
.c1 { border-top: 1px solid var(--border-soft); padding-top: 10px; }
.c1:first-child { border-top: 0; padding-top: 0; }
.c1 .who { font-size: 12px; color: var(--accent-deep); font-weight: 600; }
.c1 .like { display: inline-flex; align-items: center; gap: 3px; margin-left: 7px; font-size: 11.5px;
  color: var(--faint); font-variant-numeric: tabular-nums; }
.c1 .like svg { width: 14px; height: 14px; opacity: .7; }
.c1 .tx { margin-top: 3px; font-size: 13.5px; line-height: 1.6; word-break: break-word; white-space: pre-wrap; }
.c1 .tx.clip { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.c1 .more { margin-top: 3px; border: 0; background: none; padding: 0; color: var(--accent-deep); font: inherit; font-size: 12px; cursor: pointer; }
.c2 { margin-top: 6px; padding: 6px 9px; border-radius: 9px; background: var(--border-soft); font-size: 12.5px; line-height: 1.55; }
.c2 b { color: var(--muted); font-weight: 600; }

/* ── 提示条 ── */
.toast {
  position: fixed; left: 50%; bottom: calc(78px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: rgba(76,43,60,.94); color: #fff; padding: 9px 16px; border-radius: 999px; font-size: 13px;
  opacity: 0; pointer-events: none; transition: opacity .2s ease; z-index: 950;
}
.toast[data-on="1"] { opacity: 1; }

/* ── 续播：「上次看到 x:xx，续播？」一行小字＋两个字按钮 ── */
.resume { display: none; align-items: center; }
.resume[data-on="1"] { display: flex; }
.resume .t { white-space: nowrap; }
.resume button { border: 0; font: inherit; cursor: pointer; white-space: nowrap; }

/* ── 直播 ── */
.live-stage video { aspect-ratio: 16 / 9; object-fit: contain; }
.live-state {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 3; max-width: calc(100% - 24px);
  padding: 7px 14px; border-radius: 999px; background: rgba(28,20,30,.72); color: #f0e6f5; font-size: 12.5px;
  pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.live-meta { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.live-meta .fa { flex: none; width: 38px; height: 38px; border-radius: 999px; background: var(--border-soft) center/cover no-repeat; }
.live-meta .tx { flex: 1; min-width: 0; }
.live-meta .t { font-size: 15px; font-weight: 700; line-height: 1.35; word-break: break-word; }
.live-meta .m { margin-top: 1px; font-size: 12px; color: var(--faint); }
/* 「● 直播 · 已看 m:ss」那行（原生控件的 当前/总长 在直播里不准，见 liveClockSync） */
.live-meta .live-clock { color: var(--accent-deep); font-variant-numeric: tabular-nums; }
.live-meta .live-clock[hidden] { display: none; }
/* Chrome 原生控件右边那截「/ 0:56」是 seekable 末尾（直播活边，一直在长），直播里没意义，收掉；左边当前时间留着 */
#lv::-webkit-media-controls-time-remaining-display { display: none; }
/* 两个人在直播里的弹幕：画面垂直中线上一条慢道，和点播那条同色同样子，用 DOM 画 */
.live-dm { position: absolute; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
.live-dm-pill { position: absolute; left: 100%; top: 50%; margin-top: -1em; white-space: nowrap; font-weight: 600; line-height: 1;
  padding: 6px 13px; border: 1px solid transparent; border-radius: 999px; will-change: transform;
  text-shadow: -1px 0 rgba(34,20,38,.9), 1px 0 rgba(34,20,38,.9), 0 -1px rgba(34,20,38,.9), 0 1px rgba(34,20,38,.9); }

/* ── 嵌入模式（?embed=1，装在宿主页面的 iframe 里）：骨架上的几处收紧 ── */
html[data-embed], html[data-embed] body { min-height: 0; }   /* 不许撑满：高度要能跟着内容缩回去（bilitube:size 量的是 .wrap） */
html[data-embed] .dm-row { min-height: 26px; }
html[data-embed] .mkv { font-size: 12.5px; }
html[data-embed] #live .say { border-top: 1px solid var(--border-soft); }
html[data-embed] .live-stage video { max-height: none; }
html[data-embed] .live-meta { margin: 0; padding: 6px 10px; gap: 8px; }
html[data-embed] .live-meta .fa { width: 28px; height: 28px; }
html[data-embed] .live-meta .t { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
html[data-embed] .live-meta .m { font-size: 11px; }

/* ══════════════════════════════════════════════════════════════
   外观（颜色、字、白块、抽屉）。
   颜色：黑白一套日夜，变量名和 browse/skins.css 同名（--ink / --paper / --seam / --milk / --btn …），日夜看 data-ui-theme。
   版式：灰缝 --seam 打底、内容落在白块上；不画线不画框、无玻璃无阴影；顶栏两颗圆钮，和 browse/ 一个样子。
   动效：一组 --ease-* / --t-* / --stagger，逐行进场（.b-in）；减少动态时全归零。
   骨架那一层里还读 --text / --card / --accent… 这些名字，下面整组改指这套黑白，那些规则不用逐条改。
   ══════════════════════════════════════════════════════════════ */
.b-top, .b-meta, .b-blk, .b-empty { display: none; }
html[data-ui="b"] {
  --ink: #111111; --ink-soft: #4a4a4a; --muted: #8c8c8c; --faint: #c9c9c9;
  --btn: #111111; --btn-ink: #ffffff;
  --paper: #ffffff; --seam: #f4f4f4; --milk: #f5f5f5; --line: #e8e8e8; --hairline: #ececec;
  --pop-rgb: 17, 17, 17;
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: "SF Mono", "Fira Code", "Cascadia Code", monospace;
  --r-full: 999px;

html[data-embed][data-ui="b"] #cmtBody { padding: 0 0 6px; }
html[data-embed][data-ui="b"] .b-sheet { max-height: calc(100% - 10px); border-radius: 18px 18px 0 0; padding-bottom: 10px; }
html[data-embed][data-ui="b"] .b-empty:not([hidden]) { padding: 36px 16px; }
html[data-embed][data-ui="b"] .toast { bottom: 12px; }
/* 宿主递来的配色（bilitube:theme → <html> 上的 --host-*，见 <head> 第三段脚本），盖在上面两套日夜之上 */
html[data-embed][data-ui="b"][data-skin-from="host"] {
  --paper: var(--host-panel); --seam: var(--host-bg); --milk: var(--host-tile); --milk-strong: var(--host-tile2);
  --ink: var(--host-ink); --ink-soft: var(--host-ink2); --muted: var(--host-ink2); --faint: var(--host-ink3);
  --btn: var(--host-accent); --btn-ink: var(--host-on-accent);
  --line: var(--host-line); --hairline: var(--host-line);
}
</style>
</head>
<body>
<div class="wrap">
  <!-- 点播。顶栏、标题下那行小字、「我们的弹幕」「简介」和抽屉由脚本「界面」那段（bInit）搭起来 -->
  <section id="player" hidden>
    <h1 id="title"></h1>
    <!-- 选集：多 P 的片子在这儿换集（选哪 P 就让后端认得那 P 再开）。下拉由 bInit 搬进抽屉，这个空壳只用来记「有没有选集」 -->
    <div id="parts" hidden><select id="partSel" aria-label="选集"></select></div>
    <div class="stage">
      <video id="v" controls playsinline preload="metadata" crossorigin="use-credentials"></video>
      <div class="mkv" id="mkvTip" hidden></div>
      <canvas id="dm"></canvas>
      <div class="badge" id="badge">在看这一幕</div>
      <div class="dm-last" id="dmLast" data-on="0" aria-live="polite"></div>
      <!-- 弹幕设置、稍后再看：bInit 把这两块搬进抽屉 -->
      <div class="dm-panel" id="dmPanel" hidden>
        <div class="dm-row"><span class="k">弹幕</span><label class="dm-toggle"><input type="checkbox" id="dmsOn">显示 B 站弹幕</label><span class="spacer"></span><span class="val" id="dmsN"></span></div>
        <div class="dm-row"><span class="k">透明度</span><input type="range" id="dmsAlpha" min="20" max="100" step="5"><span class="val" id="dmsAlphaV"></span></div>
        <div class="dm-row"><span class="k">字号</span><input type="range" id="dmsSize" min="70" max="140" step="10"><span class="val" id="dmsSizeV"></span></div>
        <div class="dm-row"><span class="k">速度</span><input type="range" id="dmsSpeed" min="50" max="200" step="10"><span class="val" id="dmsSpeedV"></span></div>
        <div class="dm-row"><span class="k">我们的</span><label class="dm-toggle"><input type="checkbox" id="dmsHome">总是显示（关了 B 站弹幕也照样飘）</label></div>
        <div class="dm-row"><span class="k">我们的速度</span><input type="range" id="dmsHomeSpeed" min="30" max="100" step="5"><span class="val" id="dmsHomeSpeedV"></span></div>
        <div class="dm-row"><span class="k">显示区域</span><div class="dm-seg" id="dmsArea">
          <button type="button" data-v="0.25">1/4</button><button type="button" data-v="0.5">1/2</button>
          <button type="button" data-v="0.75">3/4</button><button type="button" data-v="1">全屏</button></div></div>
        <div class="dm-row"><span class="k">屏蔽类型</span><div class="dm-checks">
          <label><input type="checkbox" id="dmsBlockTop">顶部</label><label><input type="checkbox" id="dmsBlockBottom">底部</label>
          <label><input type="checkbox" id="dmsBlockScroll">滚动</label><label><input type="checkbox" id="dmsBlockColor">彩色</label></div></div>
        <div class="dm-row"><span class="k">密度上限</span><input type="range" id="dmsMax" min="10" max="200" step="10"><span class="val" id="dmsMaxV"></span></div>
        <div class="dm-row"><span class="k">重复合并</span><label class="dm-toggle"><input type="checkbox" id="dmsMerge">10 秒内同一句只飘一条（×N）</label></div>
        <div class="dm-row" style="align-items:flex-start"><span class="k" style="padding-top:7px">关键词</span><textarea id="dmsKw" rows="2" placeholder="屏蔽词，逗号或换行分开（不分大小写）"></textarea></div>
        <div class="dm-foot"><span>设置记在这台设备上</span><button type="button" id="dmsReset">恢复默认</button></div>
      </div>
      <!-- 每次展开都现问一次 api/films，AI 那边刚加的片子这里马上看得见 -->
      <div class="pl" id="pl" hidden>
        <div class="pl-list" id="plList"></div>
        <div class="pl-note" id="plNote"></div>
      </div>
    </div>

    <form class="say" id="sayBar">
      <input id="sayText" placeholder="发弹幕（不发去 B 站）" maxlength="60"
             autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" aria-label="发弹幕">
      <button type="submit" id="sayBtn" aria-label="发弹幕">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>
      </button>
    </form>

    <div class="cmt" id="cmt" hidden>
      <button class="cmt-head" id="cmtHead" type="button">
        <span>评论区</span><span class="n" id="cmtN"></span><span class="caret">›</span>
      </button>
      <div class="cmt-body" id="cmtBody" hidden></div>
    </div>
  </section>

  <!-- 直播 -->
  <section id="live" hidden>
    <div class="stage live-stage">
      <video id="lv" controls playsinline autoplay></video>
      <div class="live-dm" id="liveDm" aria-hidden="true"></div>
      <div class="live-state" id="liveState" hidden></div>
    </div>
    <div class="live-meta">
      <span class="fa" id="liveFace"></span>
      <div class="tx"><div class="t" id="liveTitle"></div><div class="m" id="liveSub"></div><div class="m live-clock" id="liveClock" hidden></div></div>
      <!-- 清晰度下拉：bInit 搬进抽屉 -->
      <select id="liveQn" aria-label="清晰度" hidden></select>
    </div>
    <form class="say" id="liveSayBar">
      <input id="liveSayText" placeholder="发弹幕（直播不暂停）" maxlength="60"
             autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" aria-label="发弹幕">
      <button type="submit" id="liveSayBtn" aria-label="发弹幕">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>
      </button>
    </form>
  </section>
</div>
<div class="toast" id="toast"></div>
<!-- 续播：B 站记着「上次看到」时冒出来；bInit 把它挪到标题下面 -->
<div class="resume" id="resumeAsk" role="dialog" aria-live="polite" aria-label="续播">
  <span class="t" id="resumeAskT">上次看到 0:00，续播？</span>
  <button type="button" class="go" id="resumeAskGo">续播</button><button type="button" class="no" id="resumeAskNo">不用</button>
</div>

<script>
(function () {
  "use strict";
  var BASE = location.pathname.replace(/[^\/]*$/, "");   // 这一页所在的目录（比如 /bilitube/），接口和别的文件都跟着它走
  var API = BASE + "api";
  var $ = function (id) { return document.getElementById(id); };
  // 嵌入模式：装在宿主页面的 iframe 里（<head> 第一段脚本认的旗标）。心跳、尺寸、弹幕会顺手报给宿主
  var EMBED = document.documentElement.dataset.embed === "1";
  // 称呼只从这一处取。没配置时的中性默认在这两行；bNames() 再读 browse/config.js 和 api/prefs 覆盖
  var PAL = { name: "AI", user: "你", fromPrefs: false };
  function palName() { return PAL.name || "AI"; }
  function userName() { return PAL.user || "你"; }
  function tellParent(playing) {
    if (!EMBED || window.parent === window) return;
    if (live) return liveTell();                       // 直播开着时报的是直播
    try {
      var v = $("v");
      window.parent.postMessage({
        type: "bilitube:now",
        film: cur ? cur.title : null, id: cur ? cur.id : null,
        t: cur ? (v.currentTime || 0) : 0,
        playing: cur ? (playing === false ? false : (!v.paused && !v.ended && !v.hidden)) : false
      }, location.origin);
    } catch (e) {}
  }
  // 嵌入时把内容高度报给宿主（bilitube:size；评论区、弹幕列表展开收起都会变），宿主据此调 iframe 高度。
  // 量的是 .wrap 的真实高度，不是 documentElement.scrollHeight——后者至少等于 iframe 当前的高度，只会长不会缩。
  var tellSize = function () {};
  if (EMBED && window.parent !== window) {
    var _wrap = document.querySelector(".wrap");
    tellSize = function () {
      if (!_wrap) return;
      var h = Math.ceil(_wrap.getBoundingClientRect().height);
      if (h > 0) {
        try { window.parent.postMessage({ type: "bilitube:size", h: h }, location.origin); } catch (e) {}
      }
    };
    if ("ResizeObserver" in window) new ResizeObserver(tellSize).observe(_wrap || document.body);
    window.addEventListener("load", tellSize);
  }
  // films：最近一次拉到的 /films（本地片＋后端认得的 B 站片）；cur：正在放的这部；notes / companionLog：这部的批注和 AI 的弹幕记录（都进弹幕时间轴）
  var films = [], cur = null, notes = [], companionLog = [], beatTimer = 0, badgeTimer = 0;
  function fmt(s) {
    s = Math.max(0, Math.floor(s || 0));
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
    var mm = (h ? String(m).padStart(2, "0") : String(m));
    return (h ? h + ":" : "") + mm + ":" + String(x).padStart(2, "0");
  }
  function toast(t) {
    var el = $("toast"); el.textContent = t; el.dataset.on = "1";
    setTimeout(function () { delete el.dataset.on; }, 1800);
  }
  function get(path) { return fetch(API + path, { credentials: "same-origin" }).then(function (r) { return r.json(); }); }
  function post(path, body) {
    return fetch(API + path, {
      method: "POST", credentials: "same-origin",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
    }).then(function (r) { return r.json(); });
  }

  // ── 播放 ──
  // 首帧之后再做的事：<video> 第一次 playing / loadeddata，或者 2.5 秒到了（暂停着进来、放不了的也别一直等），只跑一次
  function afterStart(f, fn) {
    var v = $("v"), done = false, timer = 0;
    var go = function () {
      if (done) return; done = true; clearTimeout(timer);
      v.removeEventListener("playing", go); v.removeEventListener("loadeddata", go);
      if (cur === f) fn();
    };
    if (!f.playable || f.kind !== "bili") return fn();
    v.addEventListener("playing", go); v.addEventListener("loadeddata", go);
    timer = setTimeout(go, 2500);
  }
  function open(f, opts) {
    opts = opts || {};                               // opts.play＝开了就放（插播、&play=1）；opts.t＝跳到第几秒
    if (cur && f && cur.id === f.id && opts.play && $("v").paused && !$("v").hidden) {
      $("player").hidden = false;
      if (opts.t > 0) seek(opts.t);                 // 带了 &t=：同一部也跳到那一秒
      try { var pp = $("v").play(); if (pp && pp.catch) pp.catch(function () {}); } catch (e) {}
      return;
    }
    if (cur && f && cur.id === f.id && !$("v").paused) {   // 同一部：直接回去接着看，别重头来
      if (opts.t > 0) seek(opts.t);
      $("player").hidden = false;
      dmStart(); tellSize();
      return;
    }
    hbReset(f);                                      // 上一部先给 B 站补一记「结束」，这一部起新账
    cur = f;
    $("player").hidden = false;
    $("title").textContent = f.title + (f.epTitle ? " " + f.epTitle : "");   // 番剧：番名 第N话 小标题
    var v = $("v");
    v.innerHTML = "";
    liveStop(true);                                  // 直播开着就先收掉
    if (f.playable) {
      $("mkvTip").hidden = true; v.hidden = false;
      if (f.kind === "bili") {
        v.removeAttribute("src"); v.load();
        routeStart(f, (opts.play || opts.t > 0) ? { play: !!opts.play, t: opts.t > 0 ? opts.t : 0 } : undefined);   // 直连：先问地址、赛一口，再喂给 <video>（见 routeStart）
      } else {
        routeStop();
        v.crossOrigin = "use-credentials";
        v.src = f.src;
        if (f.vtt) {
          var tr = document.createElement("track");
          tr.kind = "subtitles"; tr.label = "中文"; tr.srclang = "zh"; tr.src = f.vtt; tr.default = true;
          v.appendChild(tr);
        }
        v.load();
        if (opts.t > 0) {                            // 本地片子：等元数据到了再跳到 &t= 那一秒
          var tt = opts.t, onM = function () { v.removeEventListener("loadedmetadata", onM); if (cur === f) seek(tt); };
          v.addEventListener("loadedmetadata", onM);
        }
        if (opts.play) { try { var lp = v.play(); if (lp && lp.catch) lp.catch(function () {}); } catch (e) {} }
      }
    } else {
      routeStop();
      v.hidden = true; v.removeAttribute("src");
      $("mkvTip").hidden = false;
      $("mkvTip").innerHTML = "这部是 " + (f.file.split(".").pop()) +
        "，浏览器多半放不了。先在服务器上转一份 mp4（不重编码，几秒钟的事）：" +
        "<code>ffmpeg -i \"片源目录/" + f.file + "\" -c copy -movflags +faststart \"片源目录/" +
        f.title + ".mp4\"</code>（音轨编码不兼容时把 <code>-c copy</code> 换成 <code>-c:v copy -c:a aac</code>）";
    }
    notes = []; companionLog = [];
    loadNotes();
    startBeat();
    loadDanmaku(f);
    afterStart(f, function () { loadComments(f); });   // 评论区等画面动起来（或 2.5 秒）再拉，别跟首帧抢带宽
    dmPanelOpen(false);
    dmStart();
    partsSync(f);
    if (opts.t > 0) resumeHide(); else resumeAsk(f);  // B 站记着上次看到哪儿，就问一句续不续（带 &t= 进来就不问了）
    // 换片不往历史里压一格：浏览器返回一下就回 browse/
    try { history.replaceState(null, "", "#" + encodeURIComponent(f.id)); } catch (e) {}
    bOpen(f);
  }

  // ── 分 P：多 P 的片子给一个最简的选集下拉 ──
  // 每一 P 在后端是各自一条（id 带 _pN），换集＝让后端认得那 P（已认得就不出门）再 open。
  var partsFor = "";
  function partsSync(f) {
    var box = $("parts"), sel = $("partSel");
    if (f && f.pgc) return pgcPartsSync(f);
    if (!f || f.kind !== "bili" || !f.bvid || f.pages === 1) { box.hidden = true; return; }
    if (partsFor === f.bvid && sel.options.length > 1) {
      sel.value = String(f.p || 1); box.hidden = false; return;
    }
    box.hidden = true;
    var want = f.bvid;
    get("/bili/pages?bvid=" + encodeURIComponent(want)).then(function (d) {
      if (!cur || cur.bvid !== want) return;
      var ps = (d && d.pages) || [];
      if (ps.length < 2) return;
      sel.innerHTML = "";
      ps.forEach(function (x) {
        var o = document.createElement("option");
        o.value = String(x.p);
        o.textContent = "P" + x.p + (x.part ? " · " + x.part : "") + (x.duration ? "（" + fmt(x.duration) + "）" : "");
        sel.appendChild(o);
      });
      partsFor = want;
      sel.value = String(cur.p || 1);
      box.hidden = false;
      tellSize();
    }).catch(function () {});
  }
  // 番剧 / 影视：选集下拉列整部的正片（第N话 小标题），值是 ep 号；B 站标了地区受限的也列着，点了会照实说放不了
  function pgcPartsSync(f) {
    var box = $("parts"), sel = $("partSel"), key = "ss" + f.pgc.season_id;
    if (partsFor === key && sel.options.length > 1) {
      sel.value = String(f.pgc.ep_id); box.hidden = false; return;
    }
    box.hidden = true;
    var want = f.id;
    get("/bili/pages?id=" + encodeURIComponent(want)).then(function (d) {
      if (!cur || cur.id !== want) return;
      var ps = (d && d.pages) || [];
      if (ps.length < 2) return;
      sel.innerHTML = "";
      ps.forEach(function (x) {
        var o = document.createElement("option");
        o.value = String(x.ep);
        o.textContent = x.part + (x.badge ? " · " + x.badge : "") + (x.limited ? "（地区受限）" : "");
        sel.appendChild(o);
      });
      partsFor = key;
      sel.value = String(f.pgc.ep_id);
      box.hidden = false;
      tellSize();
    }).catch(function () {});
  }
  $("partSel").addEventListener("change", function () {
    var sel = this, p = Number(sel.value) || 1;
    if (cur && cur.pgc) {
      if (String(p) === String(cur.pgc.ep_id)) return;
      sel.disabled = true;
      post("/bili/add", { ref: "ep" + p }).then(function (r) {
        sel.disabled = false;
        if (r && r.ok && r.film) { toast("换到 " + (r.film.pgc && r.film.pgc.index || "这一集")); open(r.film); }
        else { toast((r && r.error) || "没换过去"); sel.value = String(cur.pgc.ep_id); }
      }).catch(function () { sel.disabled = false; toast("没换过去"); sel.value = String(cur.pgc.ep_id); });
      return;
    }
    if (!cur || !cur.bvid || p === (cur.p || 1)) return;
    sel.disabled = true;
    post("/bili/add", { ref: cur.bvid + (p > 1 ? "?p=" + p : "") }).then(function (r) {
      sel.disabled = false;
      if (r && r.ok && r.film) { toast("换到 P" + p); open(r.film); }
      else { toast((r && r.error) || "没换过去"); sel.value = String(cur.p || 1); }
    }).catch(function () { sel.disabled = false; toast("没换过去"); sel.value = String(cur.p || 1); });
  });

  // ── 批注和 AI 的弹幕记录 ──
  // api/notes 里 kind=danmaku 的是 AI 发的弹幕，其余是批注；两样都排进弹幕时间轴，放到那一秒就飘
  function loadNotes() {
    if (!cur) return;
    var id = cur.id;
    get("/notes?film=" + encodeURIComponent(id)).then(function (d) {
      if (!cur || cur.id !== id) return;
      var all = d.notes || [];
      notes = all.filter(function (n) { return n.kind !== "danmaku"; });
      companionLog = all.filter(function (n) { return n.kind === "danmaku"; });
      dmRebuild();
    });
  }
  function seek(t) { var v = $("v"); if (!v.hidden) { try { v.currentTime = t; } catch (e) {} } }

  // ── 心跳（api/beat：在放哪部、第几秒、放没放）＋ 「AI 在看这一幕」角标 ──
  function sendBeat(forcePlaying) {
    if (!cur) return;
    if (route && route.swapping && forcePlaying !== false) return;   // 直连半路换源那一下不算 TA 暂停
    var v = $("v");
    var playing = forcePlaying === false ? false : (!v.paused && !v.ended && !v.hidden);
    tellParent(playing);             // 嵌入时每一拍也抄送给宿主（bilitube:now）
    post("/beat", { film: cur.id, t: v.currentTime || 0, playing: playing })
      .then(function (d) {
        if (d && d.companionHere) lightBadge(d.companionAgeMs || 0);
        cueHandle(d);
      })
      .catch(function () {});
  }
  // ── 插播 ──
  // 不另开连接：api/beat 和 api/dm/say 的回信里捎带 cue（立刻切到这部开始放）和 upNext（这部放完接着放哪部）。
  var cueSeen = 0, cueSeeded = false, upNext = null, upNextSeen = "";
  function cueHandle(d) {
    if (!d || !("upNext" in d)) return;
    upNext = d.upNext || null;
    if (!cueSeeded) {                 // 页面刚打开的第一封回信只对表：开页之前发的插播不补放（刷新页面不会被拽走）
      cueSeeded = true;
      if (d.cue) cueSeen = d.cue.seq;
      if (upNext) upNextSeen = upNext.at;
    }
    if (upNext && upNext.at !== upNextSeen) {
      upNextSeen = upNext.at;
      if (cur && upNext.film !== cur.id) toast(palName() + "排了下一个：《" + (upNext.title || upNext.film) + "》");
    }
    var c = d.cue;
    if (c && c.seq > cueSeen) {
      cueSeen = c.seq;
      playFilm(c.film, palName() + "插播：《" + (c.title || c.film) + "》");
    }
  }
  function playFilm(id, msg) {
    var find = function () { var h = null; films.forEach(function (f) { if (f.id === id) h = f; }); return h; };
    var go = function (f) { if (msg) toast(msg); open(f, { play: true }); };
    var hit = find();
    if (hit && cur && cur.id === id) return go(hit);
    get("/films").then(function (d) { films = (d && d.films) || films; hit = find(); if (hit) go(hit); })
      .catch(function () { if (hit) go(hit); });
  }
  $("v").addEventListener("ended", function () {

  }
  function bClock(at) {
    var d = new Date(String(at || "").replace(/Z?$/, "Z"));
    if (isNaN(d)) return "";
    return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
  }
  function bDmDraw(items, isLive) {
    var box = $("bDmLines"), blk = $("bDm");
    items = items.filter(function (x) { return x && String(x.text || "").trim(); });
    items.sort(isLive
      ? function (a, b) { return (a.at || "") < (b.at || "") ? -1 : (a.at || "") > (b.at || "") ? 1 : 0; }
      : function (a, b) { return (a.t || 0) - (b.t || 0) || ((a.at || "") < (b.at || "") ? -1 : 1); });
    if (isLive && items.length > 40) items = items.slice(-40);
    blk.hidden = !items.length;
    bDmLast = { items: items, isLive: isLive };
    var keyOf = function (it) { return it.id || ((it.at || "") + "|" + it.text); };
    var folded = !bDmOpen && items.length > BDM_FOLD, keep = {};
    if (folded) items.slice().sort(function (a, b) { return (a.at || "") < (b.at || "") ? 1 : (a.at || "") > (b.at || "") ? -1 : 0; })
      .slice(0, BDM_FOLD).forEach(function (it) { keep[keyOf(it)] = 1; });
    var fb = $("bDmFold");
    fb.hidden = items.length <= BDM_FOLD;
    fb.textContent = bDmOpen ? "收起" : "展开全部 " + items.length + " 条";
    fb.setAttribute("aria-expanded", bDmOpen ? "true" : "false");
    var first = bDmSeen === null, seen = bDmSeen || {}, next = {}, k = 0, prevT = null;
    box.innerHTML = "";
    items.forEach(function (it) {
      var key = keyOf(it);
      if (folded && !keep[key]) return;
      next[key] = 1;
      var ai = it.author === "companion";
      var row = document.createElement("div");
      row.className = "b-ln " + (ai ? "ai" : "me");
      var ts;
      if (isLive) {
        ts = document.createElement("span"); ts.className = "b-ts clock"; ts.textContent = bClock(it.at);
      } else {
        var t = Number(it.t) || 0;
        ts = document.createElement("button"); ts.type = "button"; ts.className = "b-ts";
        if (prevT !== null && Math.abs(t - prevT) < 1) ts.classList.add("same");
        prevT = t;
        ts.textContent = fmt(t);
        ts.setAttribute("aria-label", "跳到 " + fmt(t));
        ts.addEventListener("click", function () { bJump(t); });
      }
      var tx = document.createElement("span"); tx.className = "tx";
      if (ai) { var w = document.createElement("span"); w.className = "who"; w.textContent = palName(); tx.appendChild(w); }
      tx.appendChild(document.createTextNode(String(it.text)));
      row.appendChild(ts); row.appendChild(tx);
      box.appendChild(row);
      if (first || !seen[key]) bIn(row, k++);
    });
    bDmSeen = next;
  }
  function bDmToggle() {                        // 展开：藏着的那些逐行进场；收起：直接回到最近几条
    if (!bDmLast) return;
    bDmOpen = !bDmOpen;
    bDmDraw(bDmLast.items, bDmLast.isLive);
    if (!bDmOpen) {
      var blk = $("bDm"), top = blk.getBoundingClientRect().top;
      if (top < 0) try { window.scrollBy({ top: top - 60, behavior: bReduce() ? "auto" : "smooth" }); } catch (e) { window.scrollBy(0, top - 60); }
    }
  }
  function bJump(t) {
    seek(t);
    var st = document.querySelector("#player .stage");
    if (st && st.getBoundingClientRect().top < 0) {
      try { window.scrollTo({ top: 0, behavior: bReduce() ? "auto" : "smooth" }); } catch (e) { window.scrollTo(0, 0); }
    }
  }
  // 小窗那一行折叠条的字：「简介 · 评论 N」（没评论就只写「简介」）
  function bFoldLabel(n) {
    var hd = $("bDesc") && $("bDesc").querySelector(".b-hd"); if (!hd) return;
    hd.textContent = n > 0 ? "简介 · 评论 " + n : "简介";
  }
  // 评论区：先露 5 条热评，底下一颗「更多」，点了剩下的逐条进场
  function bCmtFold() {
    var N = 5, body = $("cmtBody"), list = body.querySelectorAll(".c1");
    var old = body.querySelector(".b-more"); if (old) old.remove();
    Array.prototype.forEach.call(list, function (c, i) { if (i >= N) c.dataset.fold = "1"; else delete c.dataset.fold; });
    if (list.length <= N) return;
    var mb = document.createElement("button");
    mb.type = "button"; mb.className = "b-more"; mb.textContent = "更多";
    mb.addEventListener("click", function () {
      var k = 0;
      Array.prototype.forEach.call(body.querySelectorAll(".c1[data-fold]"), function (c) { delete c.dataset.fold; bIn(c, k++); });
      mb.remove();
    });
    body.appendChild(mb);
  }

  // ── 开页 ──
  bInit();
  tellParent(false);
  // 要开哪部：?film=<片名>，或者 #<片名>（#embed 是旗标不是片名）。
  // ?film= 也认 BV 号（BV…[_pN]，等于 bili:BV…）、番剧 ep / ss / md 号、live:<房间号>。
  // B 站片子直接 api/bili/add（让后端认得它、顺带直连地址）再开——链过来的人不用管后端认不认得，这页替它问。
  var qFilm = "";
  try { qFilm = (new URLSearchParams(location.search).get("film") || "").trim(); } catch (e) {}
  if (/^BV[0-9A-Za-z]{10}(_p\d{1,4})?$/.test(qFilm)) qFilm = "bili:" + qFilm;
  if (/^(ep|ss|md)\d{1,12}$/i.test(qFilm)) qFilm = "bili:" + qFilm.toLowerCase();
  // &play=1：点开就放（App 壳里不要手势；普通浏览器拦了自动播放就停在片头，等人点）
  var qPlay = false;
  try { qPlay = new URLSearchParams(location.search).get("play") === "1"; } catch (e) {}
  // &t=<秒>（也认 1:23 / 1:02:03）：进来跳到那一秒（browse/「一起聊过的片」里每句弹幕前的时间钮就是这样链过来的）
  var qT = 0;
  try {
    var rawT = (new URLSearchParams(location.search).get("t") || "").trim();
    if (/^\d+(\.\d+)?$/.test(rawT)) qT = Number(rawT);
    else if (/^\d{1,2}(:\d{1,2}){1,2}$/.test(rawT)) qT = rawT.split(":").reduce(function (a, x) { return a * 60 + Number(x); }, 0);
  } catch (e) {}
  if (!(qT > 0 && qT < 864000)) qT = 0;
  var dropQFilm = function () {            // 开上以后把 ?film= 从地址栏摘掉（hash 里已经记着），刷新/返回不打架
    if (!qFilm) return;
    try {
      var sp = new URLSearchParams(location.search); sp.delete("film"); sp.delete("play"); sp.delete("t");
      history.replaceState(null, "", location.pathname + (sp.toString() ? "?" + sp.toString() : "") + location.hash);
    } catch (e) {}
  };
  var want = qFilm || ((location.hash.length > 1 && location.hash !== "#embed") ? decodeURIComponent(location.hash.slice(1)) : "");
  if (/^live:\d{1,12}$/.test(qFilm)) { openLive(qFilm.slice(5)); dropQFilm(); }   // ?film=live:<房间号>
  else if (want) {
    // B 站片子不先等 /films（整份列表）再 /bili/add：直接 /bili/add 一趟（后端已认得的不出门），回信里顺带直连地址（direct=1），
    // 省掉两趟来回。开一条只是让后端认得它（底账），不进任何单子。本地片还是从 /films 里找。
    var m = /^bili:(BV[0-9A-Za-z]{10})(?:_p(\d{1,4}))?$/.exec(want);
    var mg = /^bili:((?:ep|ss|md)\d{1,12})$/.exec(want);     // 番剧 / 影视：ss / md＝进账号上次看到的那一集
    if (m || mg) {
      post("/bili/add", { ref: mg ? mg[1] : m[1] + (m[2] && m[2] !== "1" ? "?p=" + m[2] : ""), direct: 1 }).then(function (r) {
        if (r && r.ok && r.film) {
          if (r.direct && r.direct.ok) directPre[r.film.id] = { d: r.direct, at: Date.now() };
          open(r.film, { play: qPlay, t: qT }); dropQFilm();
        } else toast((r && r.error) || "没接上");
      }).catch(function () { toast("没接上"); });
    } else {
      get("/films").then(function (d) {
        films = d.films || [];
        var hit = null;
        films.forEach(function (f) { if (f.id === want) hit = f; });
        if (hit) { open(hit, { play: qPlay, t: qT }); dropQFilm(); return; }
        if (qFilm) toast("找不到这部片子");
      }).catch(function () { toast("片子信息没拉下来"); });
    }
  }
})();
</script>
</body>
</html>
